name: track

on:
  schedule:
    - cron: "*/15 * * * *"   # 15分ごと（GitHub側の混雑で数分〜数十分遅れることがあります）
  workflow_dispatch:          # Actions画面の「Run workflow」で手動実行
  push:
    paths: ["config.yaml"]    # 監視対象を変えたらすぐ1回実行

permissions:
  contents: write

concurrency:
  group: track
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Track
        env:
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
        run: python -m tracker.main
      - name: Save results
        run: |
          git config user.name "kol-tracker-bot"
          git config user.email "kol-tracker-bot@users.noreply.github.com"
          git add data docs/data.json
          git diff --cached --quiet && exit 0
          git commit -m "update data" -q
          git pull --rebase -q && git push -q
